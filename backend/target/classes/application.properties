server.port=8080

# Use H2 in-memory database for quick local runs/demo.
# For production/local MySQL, restore the MySQL URL and credentials.
spring.datasource.url=jdbc:h2:mem:tradingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwtSecret=SuperSecretKeyForTradingEducationPlatform123456789101112131415
app.jwtExpirationMs=86400000
